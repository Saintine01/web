<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <style>
        form{
            max-width: 300px;
            margin: 10px auto;
            padding: 10px 20px;

        h1{
            margin: 0 0 30px 0;

            color: white;
            margin: 0;
            padding: 0;
        }
        label{
            display: block;
            margin-bottom: 8px;
            color: aliceblue;
        }
        input, textarea, select{
            border: none;
            font-size: 16px;
            height: auto;
            width: 100%;
            padding: 16px;
            margin: 0;
            margin-bottom: 10px;
            border-radius: 15px;
            color: black;
            background-color: rgba(240, 181, 138, 0.5);
        }
        #menu value{
            height: auto;
            width: 100%;
            padding: 16px;
        }

        #menu{
            color: rgb(31, 31, 31);
        }

        button{
            padding: 15px 30px;
            color: rgb(17, 16, 14);
            background-color: rgb(162, 162, 160);
            font-size: 18px;
            text-align: center;
            width: 100%;
            border-radius: 20px;
        }
        body{
            background: url("image/back in.jpg");   
            background-size: cover;
            
        }
    </style>
    
</head>
